name: PV Compact

on:
  workflow_dispatch:
  push:
    branches:
      - pvcompact-clean-v1
      - main
      - feature/wattwaechter-mqtt-cloud-v179
      - feature/wattwaechter-home-v180
      - feature/wattwaechter-history-v181
      - feature/wattwaechter-home-layout-v182
      - stats-meter-reading-v177
      - octopus-day-validation-v176
      - octopus-day-breakdown-v175
      - fix-daily-octopus-v174
      - home-last-grid-day-v173
      - smartmeter-validity-v172
      - octopus-account-auth-fix
      - octopus-direct-integration
      - energy-statistics-dashboard
      - statistics-tab-v17
    paths:
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "app/**"
      - ".github/workflows/build-clean-v1.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK smoke checks
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -20
          sha256sum "$APK"

      - name: Publish direct APK download (GitHub Release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.8.2-wattwaechter-dashboard"
          ASSET="PVCompact-Dashboard-v1.8.2.apk"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PV Compact Dashboard 1.8.2 (Android APK)" \
              --notes "WattWächter-Tageshistorie, PV-Netz-Diagramm, Go-Tarifkosten und automatische MQTT-Verbindung. Eigenständige Android-Test-App, nicht im Play Store." \
              --prerelease --latest=false
          gh release upload "$TAG" "app/build/outputs/apk/debug/app-debug.apk#$ASSET" -R "$GITHUB_REPOSITORY" --clobber

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PVCompact-v1.8.2-dashboard
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
