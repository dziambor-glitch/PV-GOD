name: APK bauen

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Projekt aus ZIP entpacken und v0.3 anwenden
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted

          ZIPFILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIPFILE" ]; then
            echo "FEHLER: Keine Projekt-ZIP im Repository gefunden."
            exit 1
          fi

          echo "ZIP gefunden: $ZIPFILE"
          unzip -q -o "$ZIPFILE" -d extracted

          BUILD_FILE="$(find extracted -type f -path '*/app/build.gradle.kts' -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "FEHLER: app/build.gradle.kts wurde in der ZIP nicht gefunden."
            exit 1
          fi

          APP_DIR="$(dirname "$BUILD_FILE")"
          PROJECT_DIR="$(dirname "$APP_DIR")"
          echo "Projekt gefunden: $PROJECT_DIR"

          if [ -d overrides ]; then
            echo "v0.3-Dateien werden eingespielt..."
            cp -a overrides/. "$PROJECT_DIR/"
          fi

          if [ -d overrides_gz ]; then
            echo "Komprimierte v0.3-Dateien werden eingespielt..."
            while IFS= read -r PACKED; do
              REL="${PACKED#overrides_gz/}"
              OUT="$PROJECT_DIR/${REL%.gz.b64}"
              mkdir -p "$(dirname "$OUT")"
              base64 -d "$PACKED" | gzip -dc > "$OUT"
              echo "erstellt: $OUT"
            done < <(find overrides_gz -type f -name '*.gz.b64' | sort)
          fi

          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          # Bewährte Build-Kombination vom erfolgreichen APK-Build #5.
          sed -i 's/version "9.4.0"/version "9.1.1"/' "$PROJECT_DIR/build.gradle.kts"
          sed -E -i 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/' "$BUILD_FILE"
          sed -i 's/androidx.compose:compose-bom:2026.08.00/androidx.compose:compose-bom:2026.04.01/' "$BUILD_FILE"

          if ! grep -q '^@file:Suppress' "$BUILD_FILE"; then
            {
              echo '@file:Suppress("DEPRECATION", "DEPRECATION_ERROR")'
              echo
              cat "$BUILD_FILE"
            } > "$BUILD_FILE.tmp"
            mv "$BUILD_FILE.tmp" "$BUILD_FILE"
          fi

          grep -q '^android.builtInKotlin=false$' "$PROJECT_DIR/gradle.properties" || echo 'android.builtInKotlin=false' >> "$PROJECT_DIR/gradle.properties"
          grep -q '^android.newDsl=false$' "$PROJECT_DIR/gradle.properties" || echo 'android.newDsl=false' >> "$PROJECT_DIR/gradle.properties"

      - name: Android 36 installieren
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.3.1 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: APK bauen
        shell: bash
        run: |
          set -e
          gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PVCompact-v0.3-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
